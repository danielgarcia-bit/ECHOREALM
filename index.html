<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Echorealm</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #0b0b0b;
            color: white;
            text-align: center;
        }

        header {
            padding: 25px;
            border-bottom: 1px solid #222;
        }

        .logo {
            font-size: 32px;
            font-weight: bold;
            letter-spacing: 4px;
        }

        main {
            min-height: 70vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 30px;
        }

        h1 {
            font-size: 48px;
            margin-bottom: 15px;
        }

        p {
            color: #aaa;
            font-size: 18px;
            max-width: 500px;
        }

        .boton {
            margin-top: 25px;
            padding: 15px 30px;
            background: white;
            color: black;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
        }

        footer {
            padding: 20px;
            color: #666;
            border-top: 1px solid #222;
        }
    </style>
</head>

<body>

    <header>
        <div class="logo">ECHOREALM</div>
    </header>

    <main>
        <h1>Bienvenido a Echorealm</h1>

        <p>
            Ropa, identidad y una nueva forma de vivir la marca.
        </p>

        <a href="#" class="boton">EXPLORAR</a>
    </main>

    <footer>
        © 2026 Echorealm
    </footer>

</body>
</html>
