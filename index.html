<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Echorealm</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #0b0b0b;
            color: white;
            text-align: center;
        }

        header {
            padding: 25px;
            border-bottom: 1px solid #222;
        }

        .logo {
            font-size: 32px;
            font-weight: bold;
            letter-spacing: 4px;
        }

        main {
            min-height: 70vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 30px;
        }

        h1 {
            font-size: 48px;
            margin-bottom: 15px;
        }

        p {
            color: #aaa;
            font-size: 18px;
            max-width: 500px;
        }

        .boton {
            display: inline-block;
            margin-top: 25px;
            padding: 15px 30px;
            background: white;
            color: black;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
        }

        .productos {
            min-height: 60vh;
            padding: 80px 30px;
            border-top: 1px solid #222;
        }

        .productos h2 {
            font-size: 36px;
            margin-bottom: 20px;
        }

        .producto-prueba {
            margin: 40px auto;
            max-width: 400px;
            padding: 30px;
            border: 1px solid #333;
            border-radius: 12px;
        }

        .producto-prueba p {
            margin: 10px auto;
        }

        footer {
            padding: 20px;
            color: #666;
            border-top: 1px solid #222;
        }
    </style>
</head>

<body>

    <header>
        <div class="logo">ECHOREALM</div>
    </header>

    <main>
        <h1>Bienvenido a Echorealm</h1>

        <p>
            Ropa, identidad y una nueva forma de vivir la marca.
        </p>

        <a href="#productos" class="boton">
            EXPLORAR
        </a>
    </main>

    <section id="productos" class="productos">

        <h2>Productos</h2>

        <p>
            Descubre próximamente las prendas de Echorealm.
        </p>

        <div class="producto-prueba">

            <h3>Próximamente</h3>

            <p>
                Nuestra primera colección llegará aquí.
            </p>

        </div>

    </section>

    <footer>
        © 2026 Echorealm
    </footer>

</body>

</html>
